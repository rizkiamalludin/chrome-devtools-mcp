name: Build and typecheck

permissions:
  contents: write

on:
  push:
    branches:
      - main
      - feature/own-browser-mcp-server
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate npm lockfile and commit it to the development branch
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          npm install --package-lock-only --ignore-scripts
          target_branch=""
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_NAME}" = "feature/own-browser-mcp-server" ]; then
            target_branch="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ "${HEAD_REPO}" = "${GITHUB_REPOSITORY}" ]; then
            target_branch="${HEAD_REF}"
          fi
          if [ -n "${target_branch}" ] && [ -n "$(git status --porcelain -- package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Add reproducible npm lockfile"
            git push origin "HEAD:${target_branch}"
          fi
      - run: npm ci
      - name: Report dependency vulnerabilities
        run: |
          npm audit --json > npm-audit.json || true
          node -e "const a=require('./npm-audit.json'); console.log(JSON.stringify(a.vulnerabilities ?? {}, null, 2))"
      - run: npm run typecheck
      - run: npm run build
